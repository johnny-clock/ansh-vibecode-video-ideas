.rt{font-size:14px;font-weight:500;line-height:1.35}
.rm{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted)}
.pn{font-size:12px;color:var(--muted);margin:18px 2px 0;line-height:1.55}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(24px,5vw,80px) calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 62%,transparent);pointer-events:none}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--rule);background:var(--paper);border-radius:3px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}

.tab[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.arrows{display:flex;gap:8px}
.ar{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--paper);border-radius:3px;cursor:pointer}
.ar:hover{border-color:var(--ink)}
.ar svg{width:15px;height:15px}
.on .copy,.on .proof{animation:up .5s cubic-bezier(.16,1,.3,1) both}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
